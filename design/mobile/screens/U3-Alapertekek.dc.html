<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><title>OkosSzaki — Ajánlat alapértékek</title><script src="./support.js"></script></head>
<body><x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
.root{position:relative;width:390px;height:844px;overflow:hidden;background:#EDEBE5;color:#0E1116;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.scroll{position:absolute;inset:0;z-index:1;overflow-y:auto;box-sizing:border-box;padding:0 0 170px}
.hd{position:relative;overflow:hidden;box-sizing:border-box;padding:18px 16px 20px;border-radius:0 0 32px 32px;display:flex;flex-direction:column;gap:12px}
.glow{position:absolute;right:-90px;top:-120px;width:300px;height:300px;border-radius:150px}
.top{position:relative;display:flex;align-items:center;justify-content:space-between}
.rnd{width:48px;height:48px;border:0;border-radius:24px;display:flex;align-items:center;justify-content:center;padding:0}
.pill{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.ttl{position:relative;margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kick{position:relative;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sub{position:relative;font-size:15px;font-weight:600}
.body{padding:16px 16px 0;display:flex;flex-direction:column;gap:14px}
.card{box-sizing:border-box;border-radius:26px;background:#fff;box-shadow:0 1px 0 rgba(14,17,22,.05),0 14px 26px -18px rgba(14,17,22,.35)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5A5F68}
.h2{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700}
.fld{width:100%;box-sizing:border-box;height:56px;border:0;border-radius:20px;background:#fff;padding:0 16px;font-size:17px;font-weight:500;color:#0E1116;box-shadow:0 1px 0 rgba(14,17,22,.05),0 10px 20px -16px rgba(14,17,22,.4)}
.fld::placeholder{color:#6B7078}
.chip{height:52px;padding:0 18px;border:0;border-radius:26px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;color:#0E1116}
.bar{position:absolute;z-index:20;left:0;right:0;bottom:0;box-sizing:border-box;padding:28px 16px 18px;background:linear-gradient(to top,#EDEBE5 70%,rgba(237,235,229,0));display:flex;gap:10px}
.pri{flex:1;height:60px;border:0;border-radius:30px;background:#0E1116;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 26px -12px rgba(14,17,22,.6)}
.sq{flex:none;width:60px;height:60px;border:0;border-radius:30px;background:#fff;color:#0E1116;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -10px rgba(14,17,22,.4)}
.ic{flex:none;width:44px;height:44px;border-radius:15px;background:#F1F1F3;color:#1A1D23;display:flex;align-items:center;justify-content:center}
.row{width:100%;min-height:64px;box-sizing:border-box;padding:10px 14px;border:0;border-radius:22px;background:#fff;color:#0E1116;text-align:left;display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;box-shadow:0 1px 0 rgba(14,17,22,.05),0 12px 22px -18px rgba(14,17,22,.35)}
.scrim{position:absolute;inset:0;z-index:40;border:0;padding:0;background:rgba(14,17,22,.5)}
.sheet{position:absolute;z-index:50;left:0;right:0;bottom:0;box-sizing:border-box;padding:10px 16px 18px;border-radius:32px 32px 0 0;background:#FBFAF7;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.grab{align-self:center;flex:none;width:44px;height:5px;border-radius:3px;background:#D5D2C8}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sht{font-family:'Bricolage Grotesque',sans-serif;font-size:25px;font-weight:700;line-height:1.1}
.x{width:48px;height:48px;border:0;border-radius:24px;background:#EFEDE6;color:#0E1116;display:flex;align-items:center;justify-content:center;flex:none}
.sw{flex:none;width:64px;height:38px;border-radius:19px;position:relative}
.sw>i{position:absolute;top:4px;width:30px;height:30px;border-radius:15px;background:#fff;box-shadow:0 2px 6px rgba(14,17,22,.3)}
.badge{height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;background:#F0F0F2;color:#2B3038;flex:none}
.m{font-size:13px;font-weight:600;color:#5A5F68}
.n{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:-.02em}
.stat{flex:1;box-sizing:border-box;padding:10px 12px;border-radius:18px}

.root{background:var(--deep);color:#fff}
.hd{border-radius:0 0 32px 32px}
.bar{background:linear-gradient(to top,var(--deep) 65%,rgba(0,0,0,0))}
.card{color:#0E1116;box-shadow:inset 0 1px 0 #fff,0 16px 26px -14px rgba(0,0,0,.7),0 3px 6px -2px rgba(0,0,0,.3)}
.row{color:#0E1116;box-shadow:inset 0 1px 0 #fff,0 14px 22px -14px rgba(0,0,0,.7),0 3px 6px -2px rgba(0,0,0,.3)}
.sheet,.sht{color:#0E1116}
.h2{color:#fff}
.lbl{color:rgba(255,255,255,.78)}
.sheet .lbl{color:#5A5F68}
.sq{color:#0E1116}
.sheet .row{box-shadow:0 1px 0 rgba(14,17,22,.05),0 12px 22px -18px rgba(14,17,22,.35)}

</style>
</helmet>
<div class="root" style="--deep: #121110">
 <div class="scroll" style="padding-bottom: 190px">
  <header class="hd" style="background: #44413B; color: #fff">
   <span class="glow" aria-hidden="true" style="background: rgba(255,255,255,0.08)"></span>
   <div class="top"><button class="rnd" aria-label="Vissza" style="background: rgba(255,255,255,0.18); color: #fff"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><span class="pill" style="background: rgba(255,255,255,0.18)">Profil</span><span style="width: 48px"></span></div>
   <span class="kick" style="color: rgba(255,255,255,0.85)">Adataim</span>
   <h1 class="ttl">Ajánlat alapértékek</h1>
   <span class="sub" style="color: rgba(255,255,255,0.92)">Új ajánlatoknál ezek töltődnek elő</span>
  </header>
  <div class="body">
   <div style="display: flex; gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 700">Alapértelmezett ÁFA (%)</span><input class="fld" placeholder="" value="27"></label><label style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 700">Ajánlat érvényessége (nap)</span><input class="fld" placeholder="" value="30"></label></div>
   <label style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 700">Fizetési mód</span><input class="fld" placeholder="banki átutalás" value=""></label>
   <div style="display: flex; gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 700">Fizetési határidő (nap teljesítéstől)</span><input class="fld" placeholder="" value="8"></label><label style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 700">Előleg (%)</span><input class="fld" placeholder="" value="30"></label></div>
   <div style="display: flex; gap: 10px"><label style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0"><span style="font-size: 14px; font-weight: 700">Garancia (hónap)</span><input class="fld" placeholder="" value="24"></label><span style="flex: 1"></span></div>
   <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 700">Egyéb feltételek <span style="font-weight: 500; opacity: .75">(lábjegyzet)</span></span><textarea class="fld" style="height: 96px; padding: 14px 16px; resize: none">Az árak az anyagköltséget nem tartalmazzák.</textarea></label>
   <span class="lbl" style="color: rgba(255,255,255,0.78)">Általános Szerződési Feltételek (ÁSZF)</span>
   <span class="m" style="color: rgba(255,255,255,0.75)">Az itt feltöltött PDF automatikusan az ajánlatokhoz kerül.</span>
   <sc-if value="{{err}}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding: 12px 14px; border-radius: 18px; background: #FDECEC; color: #B71C1C; font-size: 14px; font-weight: 700">{{err}}</div></sc-if>
   <sc-if value="{{has}}" hint-placeholder-val="{{ true }}"><div class="card" style="padding: 12px 14px; display: flex; align-items: center; gap: 12px"><span class="ic" style="background: #ECEAE5; color: #44413B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7zM14 3v5h4M10 13h5M10 17h5"/></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px">aszf.pdf</b><span class="m">Feltöltve: 2026. nov. 3. 14:20</span></span></div><div style="display: flex; gap: 10px"><button onClick="{{upload}}" style="flex: 1; height: 56px; border: 0; border-radius: 28px; background: #fff; color: #44413B; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>{{upLabel}}</button><button onClick="{{remove}}" aria-label="Törlés" style="flex: none; width: 56px; height: 56px; border: 0; border-radius: 28px; background: #FDECEC; color: #B71C1C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button></div></sc-if>
   <sc-if value="{{none}}" hint-placeholder-val="{{ false }}"><button onClick="{{upload}}" style="min-height: 96px; border: 2px dashed rgba(255,255,255,0.45); border-radius: 26px; background: transparent; color: #fff; font-size: 16px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>{{upLabel}}</button></sc-if>
  </div>
 </div>
 <div class="bar"><button onClick="{{save}}" class="pri" style="background: #fff; color: #44413B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Mentés</button></div>
 <sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div role="status" style="position: absolute; z-index: 60; left: 16px; right: 16px; top: 18px; padding: 14px 16px; border-radius: 22px; background: #14532D; color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>{{toast}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { toast: '', has: true, busy: false };
  renderVals() {
    const st = this.state;
    const flash = (m) => { this.setState({ toast: m }); setTimeout(() => this.setState({ toast: '' }), 2000); };
    return {
      toast: st.toast, save: () => flash('Adatok elmentve!'), has: st.has, none: !st.has, err: '',
      upload: () => { this.setState({ busy: true }); setTimeout(() => { this.setState({ busy: false, has: true }); flash('Mentve!'); }, 700); },
      upLabel: st.busy ? 'Feltöltés…' : (st.has ? 'Csere' : 'PDF feltöltése'),
      remove: () => this.setState({ has: false })
    };
  }
}
</script></body></html>
